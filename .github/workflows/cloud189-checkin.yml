name: Cloud 189 Checkin

on:
  schedule:
    - cron: '0 6 * * *'   # 每天早上 6 点执行
  workflow_dispatch:      # 手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate unique cache key
        id: cache-key
        run: echo "key=Linux-cache-token-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # 虽然 Node 20 即将弃用，但目前仍可用
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: node-cache-Linux-x64-npm-${{ github.sha }}
          restore-keys: |
            node-cache-Linux-x64-npm-

      - name: Install secrets to env
        uses: shine1594/secrets-to-env-action@v2   # ← 官方 v2 版本（已修复 Node 20 问题）

      - name: Install dependencies
        run: npm install

      - name: Retry failed steps
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 10

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            ~/.cache
          key: ${{ steps.cache-key.outputs.key }}

      - name: Commit changes
        run: |
          git config --local user.email "82486341+qinyu521@users.noreply.github.com"
          git config --local user.name "qinyu521"
          git add -A
          git commit -m "Keep Running... (daily checkin)"
          git push origin main
